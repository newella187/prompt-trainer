<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISO Prompt Builder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>ISO 9001 / 14001 / 45001 Prompt Builder</h1>
        <p>
          Build high-quality prompts for audit-ready responses in clear UK English.
        </p>
      </header>

      <section class="panel">
        <h2>Your Input</h2>
        <form id="prompt-form">
          <label for="input-type">Input type</label>
          <select id="input-type" name="input-type">
            <option value="question">Question</option>
            <option value="clause">Clause</option>
            <option value="source">Source material</option>
          </select>

          <label for="user-input">Paste the question, clause, or source material</label>
          <textarea
            id="user-input"
            name="user-input"
            rows="12"
            placeholder="Example: ISO 9001 Clause 8.5.1 - How does the company control production and service provision?"
            required
          ></textarea>

          <button type="submit">Generate Prompt</button>
        </form>
      </section>

      <section class="panel output-panel">
        <div class="output-header">
          <h2>Generated Prompt</h2>
          <button id="copy-btn" type="button">Copy</button>
        </div>
        <pre id="output" aria-live="polite">Your generated prompt will appear here.</pre>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
